server:
  port: 8080

spring:
  application:
    name: campus-reservation
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus_reservation?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:your-mysql-password}
  sql:
    init:
      mode: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: campus-reservation-secret-2026-caxdzypingtai
  expire-hours: 72

# 智约 AI 机器人（DeepSeek、 OpenAI 兼容 API）
# api-key 建议以环境变量 DEEPSEEK_API_KEY 注入；为空时 /api/ai/chat 直接返回 503
deepseek:
  enabled: ${DEEPSEEK_ENABLED:true}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  model: ${DEEPSEEK_MODEL:deepseek-chat}
  api-key: ${DEEPSEEK_API_KEY:}
  max-tool-loops: 6
